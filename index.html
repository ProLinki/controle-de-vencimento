<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Mercadinho Belo - Controle</title>
<link rel="stylesheet" href="style.css?v=1">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="app-header"><div class="container"><h1>🛒 Mercadinho Belo</h1><span class="subtitle">Controle de Vencimento</span></div></header>
<main class="container">
<section class="card"><h2>Cadastrar Produto / Lote</h2><p class="sub">O mesmo produto pode ter vários lotes com datas diferentes.</p><form id="formProduto"><div class="input-group"><label>Nome do produto</label><input type="text" id="nome" placeholder="Ex: Leite Integral" required></div><div class="input-group"><label>Quantidade deste lote</label><input type="number" id="quantidade" min="1" value="1" required></div><div class="input-group"><label>Data de vencimento deste lote</label><input type="date" id="vencimento" required></div><button type="submit" class="btn btn-success">Adicionar Lote</button></form></section>
<section class="card"><h2>Configuração de Alerta</h2><div class="input-group"><label>Exibir alerta quando faltar (dias)</label><input type="number" id="diasAlerta" min="1" value="3"></div></section>
<section class="card"><h2>Lotes por Vencimento</h2><div class="input-group search-group"><input type="text" id="busca" placeholder="Buscar produto..."></div><div id="lista-produtos" class="produto-lista"></div><div id="vazio" class="empty-state"><p>Nenhum lote cadastrado ainda.</p></div></section>
<section class="card stats"><div class="stat-item"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Total de lotes</div></div><div class="stat-item alert"><div class="stat-number" id="statProximos">0</div><div class="stat-label">Vencem em até <span id="diasAlertaLabel">3</span> dia(s)</div></div><div class="stat-item danger"><div class="stat-number" id="statVencidos">0</div><div class="stat-label">Já venceram</div></div></section>
</main>
<div id="toast" class="toast"></div>
<div id="install-bar" class="install-bar"><span>Instalar como aplicativo?</span><button id="btnInstall" class="btn btn-success">Instalar</button><button id="btnCloseInstall" class="btn btn-outline">×</button></div>
<script src="script.js?v=1"></script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js').then(reg=>console.log('SW ok',reg.scope)).catch(err=>console.log('Erro SW',err));}</script>
</body>
</html>
