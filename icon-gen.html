<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>icon gen</title></head>
<body>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="cMask" width="512" height="512"></canvas>
<script>
window.iconResults = {};
function gen(size, canvasId, src, fullBleed) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      // fundo
      if (fullBleed) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        // redesenha só o conteúdo central sem o fundo? Simples: desenha ícone com fundo quadrado via re-render abaixo
      } else {
        ctx.drawImage(img, 0, 0, size, size);
      }
      window.iconResults[canvasId] = c.toDataURL('image/png').split(',')[1];
      resolve(true);
    };
    img.src = src;
  });
}
async function run() {
  const svg = await fetch('./icon.svg').then(r => r.text());
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  await gen(512, 'c512', url, false);
  await gen(192, 'c192', url, false);
  // maskable: fundo full-bleed + arte com padding (desenha escala reduzida)
  await new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.getElementById('cMask');
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, 512, 512);
      const scale = 0.82;
      const off = (1 - scale) / 2 * 512;
      ctx.save();
      ctx.translate(off, off);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, 512, 512);
      ctx.restore();
      window.iconResults['cMask'] = c.toDataURL('image/png').split(',')[1];
      resolve(true);
    };
    img.src = url;
  });
  window.iconDone = true;
}
run();
</script>
</body>
</html>
